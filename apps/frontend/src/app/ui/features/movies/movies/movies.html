<div class="page">
  <h1 class="page-title">Films</h1>

  <div class="tabs" role="tablist">
    <button role="tab" [class.active]="tab() === 'watchlist'" (click)="tab.set('watchlist')">
      Watchlist ({{ store.watchlist().length }})
    </button>
    <button role="tab" [class.active]="tab() === 'watched'" (click)="tab.set('watched')">
      Vus ({{ store.watched().length }})
    </button>
  </div>

  @if (store.loading() && !store.loaded()) {
    <div class="poster-grid">
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <div class="skeleton poster-skeleton"></div>
      }
    </div>
  } @else if (visible().length === 0) {
    @if (tab() === 'watchlist') {
      <app-empty-state icon="pi-bookmark" message="Watchlist vide" hint="Ajoute des films depuis l'onglet Explorer." />
    } @else {
      <app-empty-state icon="pi-ticket" message="Aucun film vu" hint="Marque tes films vus depuis la watchlist." />
    }
  } @else {
    <div class="poster-grid">
      @for (movie of visible(); track movie.tmdbMovieId) {
        <div class="movie">
          <figure>
            <a [routerLink]="['/movies', movie.tmdbMovieId]" [attr.aria-label]="movie.title">
              <app-poster-img [src]="poster(movie)" [alt]="movie.title" />
            </a>
            <div class="overlay">
              @if (movie.watchedAt === null) {
                <button class="check-btn" (click)="setWatched(movie, true)" aria-label="Marquer vu">
                  <i class="pi pi-check"></i>
                </button>
              } @else {
                <button class="check-btn checked" (click)="setWatched(movie, false)" aria-label="Marquer non vu">
                  <i class="pi pi-check"></i>
                </button>
              }
              <button class="check-btn remove" (click)="remove(movie)" aria-label="Retirer">
                <i class="pi pi-trash"></i>
              </button>
            </div>
          </figure>
          <a class="name" [routerLink]="['/movies', movie.tmdbMovieId]">{{ movie.title }}</a>
          @if (year(movie); as y) {
            <span class="sub muted">{{ y }}</span>
          }
        </div>
      }
    </div>
  }
</div>
