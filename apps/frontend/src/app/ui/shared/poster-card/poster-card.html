<figure>
  <app-poster-img [src]="posterUrl()" [alt]="name()" />
</figure>
@if (progressValue() !== null && progressTotal() !== null) {
  <app-progress-bar [value]="progressValue()!" [total]="progressTotal()!" />
}
<div class="meta">
  <span class="name">{{ name() }}</span>
  @if (sublabel(); as sub) {
    <span class="sub">{{ sub }}</span>
  }
</div>
