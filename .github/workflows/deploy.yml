name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Synchroniser les sources
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude dist \
            --exclude .nx --exclude .angular --exclude tmp --exclude .env \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/vu/"

      - name: Écrire le .env de production
        run: |
          printf '%s' "${{ secrets.PROD_ENV_FILE }}" | \
            ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cat > /opt/vu/.env && chmod 600 /opt/vu/.env'

      - name: Build & déploiement (images ARM natives sur le VPS)
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /opt/vu && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f'

      - name: Smoke test
        run: |
          sleep 10
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'curl -sf -o /dev/null -w "web: %{http_code}\n" http://127.0.0.1:8180/ && \
             curl -s -o /dev/null -w "api: %{http_code}\n" http://127.0.0.1:8180/api/shows'
