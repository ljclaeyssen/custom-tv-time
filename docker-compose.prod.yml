services:
  db:
    image: postgres:17-alpine
    container_name: vu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - vu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/ljclaeyssen/custom-tv-time:latest
    container_name: vu-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      TVTIME_EXPORT_PATH: /data/tvtime-export/tvtime-full-export.json
      TVTIME_SEEN_FLAGS_PATH: /data/tvtime-export/tvtime-seen-flags.json
    volumes:
      - ./tvtime-export:/data/tvtime-export:ro
    ports:
      # Publié en local uniquement — Caddy reverse-proxy dessus (vu.ljclaeyssen.fr).
      - '127.0.0.1:3003:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  vu-db-data:
